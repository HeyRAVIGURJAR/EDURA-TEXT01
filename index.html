<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="EDURA — AI-powered education platform with gamified dashboard, live classes, mock tests, and performance analytics. Learn smarter, not harder." />
    <meta name="keywords" content="education, AI, learning, gamification, mock tests, live classes, study buddy" />
    <title>EDURA | AI-Powered Education Platform</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Critical Assets Preload -->
    <link rel="preload" as="image" href="/images/disine-1.png" />
    <link rel="preload" as="image" href="/images/disine-2.png" />
    <!-- Tailwind Play CDN for layout classes and keyframes config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            keyframes: {
              shine: {
                '100%': { transform: 'translateX(150%)' }
              }
            },
            animation: {
              shine: 'shine 1.5s infinite'
            }
          }
        }
      }
    </script>

  </head>
  <body className="bg-[#000000] text-[#F1F5F9] select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
